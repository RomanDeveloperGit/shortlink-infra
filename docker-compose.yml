services:
  link-api-db:
    image: postgres:18.6-alpine
    container_name: shortlink-link-api-db
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: shortlink_link_api_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres-data:/var/lib/postgresql
  kafka:
    image: apache/kafka:4.3.1
    container_name: shortlink-kafka
    ports:
      - 9094:9094
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@shortlink-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://shortlink-kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      # KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      # KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      # KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/jaas.conf"
      # KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      # KAFKA_SUPER_USERS: "admin:admin"
    volumes:
      - kafka-data:/var/lib/kafka/data
      # - ./kafka/jaas.conf:/etc/kafka/jaas.conf
  redis:
    image: redis:8.8.3-alpine
    container_name: shortlink-redis
    ports:
      - 6379:6379
    # это условный super-user, для остальных также нужно настраивать ACL
    command: ["redis-server", "--requirepass", "admin"]
  clickhouse:
    image: clickhouse/clickhouse-server:26.9-alpine
    container_name: shortlink-clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    environment:
      CLICKHOUSE_DB: shortlink
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: shortlink-pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - link-api-db
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: shortlink-kafka-ui
    ports:
      - "9090:8080"
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: shortlink-kafka:9092
      DYNAMIC_CONFIG_ENABLED: true
      AUTH_TYPE: LOGIN
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: admin
    depends_on:
      - kafka
  redis-insight:
    image: redis/redisinsight:latest
    container_name: shortlink-redis-insight
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    depends_on:
      - redis

volumes:
  postgres-data:
    name: shortlink-postgres-data
  kafka-data:
    name: shortlink-kafka-data
  redis-data:
    name: shortlink-redis-data
  pgadmin-data:
    name: shortlink-pgadmin-data
  redis-insight-data:
    name: shortlink-redis-insight-data
  clickhouse-data:
    name: shortlink-clickhouse-data